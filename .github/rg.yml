trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Apne Azure Service Connection ka naam yahan likhein
  azureServiceConnection: 'MyAzureServiceConnection'
  # Backend storage jahan state file save hogi
  resourceGroupName: 'TF-State-RG'
  storageAccountName: 'tfstatestorageaccount'
  containerName: 'tfstate'
  tfStateKey: 'terraform.tfstate'

steps:
# Step 1: Terraform CLI Install Karna
- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: 'latest'

# Step 2: Terraform Init (Backend Configuration k sath)
- task: TerraformTaskV4@4
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: '$(azureServiceConnection)'
    backendAzureRmResourceGroupName: '$(resourceGroupName)'
    backendAzureRmStorageAccountName: '$(storageAccountName)'
    backendAzureRmContainerName: '$(containerName)'
    backendAzureRmKey: '$(tfStateKey)'

# Step 3: Terraform Validate (Code check karne k liye)
- task: TerraformTaskV4@4
  displayName: 'Terraform Validate'
  inputs:
    provider: 'azurerm'
    command: 'validate'

# Step 4: Terraform Plan (Changes preview karne k liye)
- task: TerraformTaskV4@4
  displayName: 'Terraform Plan'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: '$(azureServiceConnection)'

# Step 5: Terraform Apply (Resource Group create karne k liye)
- task: TerraformTaskV4@4
  displayName: 'Terraform Apply'
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: '$(azureServiceConnection)'
